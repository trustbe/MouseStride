name: Release Windows

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Extract version
        id: version
        shell: bash
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build release
        working-directory: daemon-windows
        run: cargo build --release

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Initialize WiX
        working-directory: daemon-windows
        run: cargo wix init --force

      - name: Add launch-after-install to WiX config
        working-directory: daemon-windows
        shell: pwsh
        run: |
          $wxs = Get-Content wix\main.wxs -Raw
          # Add CustomAction to launch app after install
          $customAction = @'
          <CustomAction Id="LaunchApp" Directory="APPLICATIONFOLDER" ExeCommand="[APPLICATIONFOLDER]bin\mousestride.exe" Execute="immediate" Return="asyncNoWait" />
          <InstallExecuteSequence>
            <Custom Action="LaunchApp" After="InstallFinalize">NOT Installed OR REINSTALL</Custom>
          </InstallExecuteSequence>
          '@
          # Insert before closing </Product> tag
          $wxs = $wxs -replace '</Product>', "$customAction`n    </Product>"
          Set-Content wix\main.wxs $wxs
          Write-Host "Added launch-after-install action"

      - name: Build MSI
        working-directory: daemon-windows
        run: cargo wix --no-build --nocapture

      - name: Upload MSI to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          MSI=$(ls daemon-windows/target/wix/*.msi | head -1)
          VERSION=${{ steps.version.outputs.tag }}
          gh release upload "$VERSION" "$MSI" --clobber || \
          gh release create "$VERSION" "$MSI" \
            --title "MouseStride $VERSION" \
            --generate-notes
