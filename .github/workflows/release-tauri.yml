name: Release Tauri

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: src-tauri/target/release/bundle/msi/*.msi
          - os: ubuntu-22.04
            artifact: src-tauri/target/release/bundle/appimage/*.AppImage
          - os: macos-latest
            artifact: src-tauri/target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libappindicator3-dev
          librsvg2-dev
          patchelf
          libx11-dev
          libxrandr-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Extract version
        id: version
        shell: bash
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        run: npx tauri build

      - name: Upload artifacts to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(${{ matrix.artifact }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts found matching ${{ matrix.artifact }}"
            exit 1
          fi
          for file in "${files[@]}"; do
            gh release upload "${{ steps.version.outputs.tag }}" "$file" --clobber \
              || gh release create "${{ steps.version.outputs.tag }}" "$file" \
                --title "MouseStride ${{ steps.version.outputs.tag }}" \
                --generate-notes
          done
